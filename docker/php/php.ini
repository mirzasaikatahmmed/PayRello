; Payrello PHP Configuration

[PHP]
; Required settings
allow_url_fopen = On
file_uploads = On
date.timezone = UTC

; Upload limits (adjust for production needs)
upload_max_filesize = 32M
post_max_size = 64M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M

; BCMath precision (critical for payment calculations)
bcscale = 8

; Session security
session.cookie_httponly = On
session.use_strict_mode = On
session.gc_maxlifetime = 1440

; Error handling (set to 0 in production)
display_errors = Off
log_errors = On
error_log = /var/log/apache2/php_error.log

; OPcache (production performance)
[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1
