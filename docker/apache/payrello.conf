<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Trust reverse proxy SSL termination
    SetEnvIf X-Forwarded-Proto https HTTPS=on

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </Directory>

    # Block web access to Docker support files
    <Directory /var/www/html/docker>
        Require all denied
    </Directory>

    # Block web access to the install directory after setup
    <Directory /var/www/html/pp-content/pp-install>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/payrello_error.log
    CustomLog ${APACHE_LOG_DIR}/payrello_access.log combined
</VirtualHost>
