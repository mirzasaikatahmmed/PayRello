services:
  web:
    image: mirzasaikatahmmed/payrello:latest
    container_name: payrello_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5060}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-payrello}
      DB_USER: ${DB_USER:-payrello}
      DB_PASS: ${DB_PASS:-payrello_secret}
      DB_PREFIX: ${DB_PREFIX:-pp_}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@1234}
      APP_PORT: ${APP_PORT:-5060}
    volumes:
      # Persist user uploads and storage across container recreates
      - payrello_media:/var/www/html/pp-media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - payrello_network

  db:
    image: mariadb:10.11
    container_name: payrello_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-payrello}
      MYSQL_USER: ${DB_USER:-payrello}
      MYSQL_PASSWORD: ${DB_PASS:-payrello_secret}
    volumes:
      - payrello_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - payrello_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: payrello_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8181}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    depends_on:
      - db
    networks:
      - payrello_network
    profiles:
      - tools

volumes:
  payrello_db:
    driver: local
  payrello_media:
    driver: local

networks:
  payrello_network:
    driver: bridge
